<body><style>canvas{position:fixed;z-index:-100;inset:0;height:100%;width:100%;background-color:black}body{display:flex;justify-content:center;align-items:center;height:100vh}.bP button{font-weight:800;font-family:fantasy;font-size:1.5vw;background-color:rgb(71,58,58);border-radius:10px;cursor:pointer;box-shadow:3px 3px 0 rgb(35,29,29);border-color:rgb(50,41,41);border-width:2px;border-style:solid;transition:100ms}.bP{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}.bP button:active{box-shadow:1px 1px 0 rgb(35,29,29);scale:95%;transform:translateY(2px)}</style><canvas id="b"></canvas><div style=" width: 15vw; background-color: rgb(37, 35, 35); padding: 10px; border-radius: 15px; box-shadow: 7px 7px 0 rgb(35, 33, 33); border: 2px solid rgb(43, 38, 38); " ><div style=" color: white; font: italic; font-size: xx-small; font-family: fantasy; " > Vanger claculator </div><div id="d" type="text" style=" width: 100%; height: 50px; background-color: white; margin-top: 10px; margin-bottom: 10px; border-radius: 7px; font-size: xx-large; border: 2px solid black; box-shadow: 0px 8px 5px rgba(0, 0, 0, 0.12); overflow: scroll; " ></div><div class="bP"><button onclick="">AC</button><button id="divide">&#247;</button><button id="multiply">&#215;</button><button>DEL</button><button>7</button><button>8</button><button>9</button><button>-</button><button>4</button><button>5</button><button>6</button><button>+</button><button>1</button><button>2</button><button>3</button><button style="grid-row: span 2">=</button><button style="grid-column: span 2">0</button><button>.</button></div></div><script>const canva=document.getElementById("b"),ctx=canva.getContext("2d");canva.width=window.innerWidth,canva.height=window.innerHeight;for(let o=0;o<1e3;o++){let o=3*Math.random();ctx.beginPath(),ctx.arc(1920*Math.random(),1080*Math.random(),o,0,Math.PI*o),ctx.fillStyle="white",ctx.fill()}const display=document.getElementById("d");var operation="",real_op="";const audioagent=new AudioContext;document.querySelectorAll(".bP button").forEach(button=>{button.addEventListener("click",()=>{const osc=audioagent.createOscillator();if(osc.frequency.value=1500,osc.connect(audioagent.destination),osc.start(),osc.stop(audioagent.currentTime+.09),"="==button.innerHTML){try{console.log(real_op,operation),real_op=eval(real_op).toString(),operation=real_op}catch(o){console.log(o),operation="ERR",display.innerHTML=operation,setTimeout(()=>{operation="",real_op="",display.innerHTML=operation},500)}display.innerHTML=operation}else"AC"==button.innerHTML?(operation="",real_op=""):"divide"==button.id?(operation+="&#247;",real_op+="/",console.log(real_op)):"multiply"==button.id?(operation+="&#215;",real_op+="*",console.log(real_op)):"DEL"==button.innerHTML?(console.log(real_op),console.log(operation),operation=operation.slice(0,-1),real_op=real_op.slice(0,-1),console.log(real_op),console.log(operation)):(operation+=button.innerHTML,real_op+=button.innerHTML);display.innerHTML=operation})});</script></body>
