<body>
  <style>
    body {
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .buttonsPad button {
      font-weight: 800;
      font-family: fantasy;
      font-size: xx-large;
      background-color: rgb(71, 58, 58);
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 3px 3px 0 rgb(35, 29, 29);
      border-color: rgb(50, 41, 41);
      border-width: 2px;
      border-style: solid;
      transition: 100ms;
    }
    .buttonsPad {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 10px;
    }
    .buttonsPad button:active {
      box-shadow: 1px 1px 0 rgb(35, 29, 29);
      scale: 95%;
      transform: translateY(2px);
    }
  </style>
  <div
    style="
      width: 15vw;
      background-color: rgb(37, 35, 35);
      padding: 10px;
      border-radius: 15px;
      box-shadow: 7px 7px 0 rgb(35, 33, 33);
      border: 2px solid rgb(43, 38, 38);
    "
  >
    <div
      style="
        color: white;
        font: italic;
        font-size: xx-small;
        font-family: fantasy;
      "
    >
      Vanger claculator
    </div>
    <div
      id="display"
      type="text"
      style="
        width: 100%;
        height: 50px;
        background-color: white;
        margin-top: 10px;
        margin-bottom: 10px;
        border-radius: 7px;
        font-size: xx-large;
        border: 2px solid black;
        box-shadow: 0px 8px 5px rgba(0, 0, 0, 0.12);
        overflow: scroll;
      "
    ></div>
    <div class="buttonsPad">
      <button onclick="">AC</button>
      <button id="divide">&#247;</button>
      <button id="multiply">&#215;</button>
      <button>DEL</button>
      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button>-</button>
      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button>+</button>
      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button style="grid-row: span 2">=</button>
      <button style="grid-column: span 2">0</button>
      <button>.</button>
    </div>
  </div>
  <script>
    const display = document.getElementById("display");
    var operation = "";
    var real_op = "";
    const audioagent = new AudioContext();
    document.querySelectorAll(".buttonsPad button").forEach((button) => {
      button.addEventListener("click", () => {
        const osc = audioagent.createOscillator();
        osc.frequency.value = 1500;
        osc.connect(audioagent.destination);
        osc.start();
        osc.stop(audioagent.currentTime + 0.09);
        if (button.innerHTML == "=") {
          try {
            console.log(real_op, operation);
            real_op = eval(real_op).toString();
            operation = real_op;
          } catch (error) {
            console.log(error);
            operation = "ERR";
            display.innerHTML = operation;
            setTimeout(() => {
              operation = "";
              real_op = "";
              display.innerHTML = operation;
            }, 500);
          }
          display.innerHTML = operation;
        } else if (button.innerHTML == "AC") {
          operation = "";
          real_op = "";
        } else if (button.id == "divide") {
          operation = operation + "&#247;";
          real_op = real_op + "/";
          console.log(real_op);
        } else if (button.id == "multiply") {
          operation = operation + "&#215;";
          real_op = real_op + "*";
          console.log(real_op);
        } else if (button.innerHTML == "DEL") {
          console.log(real_op);
          console.log(operation);
          operation = operation.slice(0, -1);
          real_op = real_op.slice(0, -1);
          console.log(real_op);
          console.log(operation);
        } else {
          operation = operation + button.innerHTML;
          real_op = real_op + button.innerHTML;
        }
        display.innerHTML = operation;
      });
    });
  </script>
</body>
